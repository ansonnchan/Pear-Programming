spring:
  autoconfigure:
    # Most tests use MockMvc container sessions; SessionPersistenceTests turns Spring Session back on.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: jdbc:h2:mem:pearprogram-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 1
      timeout: 100ms
pearprogram:
  realtime:
    redis-broadcast-enabled: false
